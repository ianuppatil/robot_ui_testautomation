name: UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  robot-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug browser paths
        run: |
          which chrome || true
          which google-chrome || true
          which chromedriver || true
          chromedriver --version || true
          google-chrome --version || true
          chrome --version || true

      - name: Remove incompatible preinstalled ChromeDriver
        run: |
          if [ -x /usr/bin/chromedriver ]; then
            sudo rm -f /usr/bin/chromedriver
          fi
          which chromedriver || true

      - name: Run Robot tests (headless)
        env:
          HEADLESS: "true"
          SKIP_ON_AMAZON_CHALLENGE: "true"
          ROBOT_OUTPUTDIR: reports
          ROBOT_SUITE: tests/amazon_smoke_tests.robot
          ROBOT_MAX_ATTEMPTS: "2"
          ROBOT_RETRY_DELAY_SECONDS: "20"
        run: |
          CHROME_BIN=$(which chrome || which google-chrome)
          export CHROME_BINARY="$CHROME_BIN"
          python scripts/run_robot_ci.py

      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: reports/

