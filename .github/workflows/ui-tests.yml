name: UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  robot-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug browser paths
        run: |
          which chrome || true
          which google-chrome || true
          which chromedriver || true
          chromedriver --version || true

      - name: Run Robot tests (headless)
        env:
          HEADLESS: "true"
        run: |
          CHROME_BIN=$(which chrome || which google-chrome)
          DRIVER_BIN=$(which chromedriver)
          python -m robot \
            --outputdir reports \
            --xunit reports/xunit.xml \
            --variable HEADLESS:true \
            --variable BROWSER:chrome \
            --variable CHROME_BINARY:$CHROME_BIN \
            --variable DRIVER_PATH:$DRIVER_BIN \
            tests/amazon_smoke_tests.robot

      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: reports/

